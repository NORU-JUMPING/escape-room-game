
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사라진 방의 기록</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:#151719;color:#eee;
  font-family:Arial,sans-serif;
}
header{
  padding:22px 18px;background:#202326;
  border-bottom:1px solid #444;
}
h1{font-size:23px;margin:0 0 7px}
header p{color:#aaa;font-size:13px;margin:0}
main{max-width:600px;margin:auto;padding:18px}
.room{
  position:relative;min-height:330px;
  background:linear-gradient(145deg,#484039,#25221f);
  border:8px solid #625344;border-radius:5px;
  overflow:hidden;
}
.window{
  position:absolute;top:35px;left:12%;
  width:27%;height:110px;
  background:linear-gradient(#53616a,#192b38);
  border:7px solid #88765f;
}
.window:after{
  content:"";position:absolute;left:50%;
  height:100%;border-left:3px solid #88765f;
}
.desk{
  position:absolute;bottom:35px;left:13%;
  width:42%;height:65px;background:#65452e;
  border:5px solid #37251c;
}
.desk:after{
  content:"";position:absolute;top:100%;
  left:12%;width:12px;height:45px;background:#39271d;
  box-shadow:145px 0 #39271d;
}
.door{
  position:absolute;right:9%;bottom:0;
  width:27%;height:73%;background:#493326;
  border:7px solid #251c17;
  border-bottom:0;cursor:pointer;
}
.door:after{
  content:"";position:absolute;right:12px;top:53%;
  width:10px;height:10px;border-radius:50%;
  background:#d7ad58;
}
.object{
  position:absolute;cursor:pointer;
  font-size:36px;filter:drop-shadow(0 3px 3px #111);
  transition:.2s;
}
.object:active{transform:scale(1.2)}
.note{left:22%;bottom:115px}
.clock{right:17%;top:50px}
.box{left:48%;bottom:110px}
.hint{
  color:#aaa;font-size:13px;
  text-align:center;margin:15px 0;
}
.panel{
  background:#24282b;padding:17px;
  border-radius:10px;margin-top:17px;
}
h2{font-size:17px;margin:0 0 12px}
button{
  background:#65523e;color:white;
  border:1px solid #9b8060;
  border-radius:7px;padding:11px 14px;
  font-size:14px;cursor:pointer;
}
button:active{background:#917653}
#message{
  min-height:55px;line-height:1.7;
  color:#e6d3ad;font-size:14px;
}
#inventory{
  display:flex;gap:8px;flex-wrap:wrap;
}
.item{
  background:#3b3933;padding:9px;
  border-radius:6px;font-size:13px;
}
input{
  width:130px;padding:12px;
  background:#17191a;color:white;
  border:1px solid #777;border-radius:6px;
  font-size:20px;text-align:center;
  letter-spacing:5px;
}
footer{text-align:center;color:#777;padding:25px;font-size:12px}
</style>
</head>
<body>
<header>
<h1>사라진 방의 기록</h1>
<p>ESCAPE ROOM · MYSTERY NO. 001</p>
</header>

<main>
<p>눈을 떠보니 낯선 방입니다. 문은 잠겨 있습니다.</p>
<p>방 안을 조사하고 탈출할 방법을 찾아보세요.</p>

<div class="room">
  <div class="window"></div>
  <div class="desk"></div>
  <div class="door" onclick="inspect('door')"></div>
  <div class="object note" onclick="inspect('note')">📜</div>
  <div class="object clock" onclick="inspect('clock')">🕰️</div>
  <div class="object box" onclick="inspect('box')">📦</div>
</div>

<p class="hint">방 안의 물건을 눌러 조사해 보세요.</p>

<section class="panel">
<h2>🔎 조사 기록</h2>
<div id="message">아직 발견한 단서가 없습니다.</div>
</section>

<section class="panel">
<h2>🎒 수집한 단서</h2>
<div id="inventory">아직 수집한 단서가 없습니다.</div>
</section>

<section class="panel">
<h2>🔐 잠긴 상자 암호</h2>
<p style="font-size:13px;color:#aaa">
단서를 조합해 네 자리 숫자를 입력하세요.
</p>
<input id="code" type="number" inputmode="numeric"
placeholder="????" maxlength="4">
<button onclick="unlock()">확인</button>
</section>

<section class="panel">
<h2>🚪 탈출하기</h2>
<button onclick="inspect('door')">문 열어보기</button>
</section>
</main>

<footer>THE RECORD OF THE LOST ROOM</footer>

<script>
let clues=[];
let boxOpen=false;
let won=false;

function say(text){
 document.getElementById("message").textContent=text;
}

function addClue(name){
 if(!clues.includes(name)){
  clues.push(name);
  document.getElementById("inventory").innerHTML=
  clues.map(x=>'<span class="item">'+x+'</span>').join("");
 }
}

function inspect(obj){
 if(won)return;

 if(obj==="note"){
  say("오래된 편지가 있습니다. '시간이 멈춘 곳을 보라. 네 번째 달의 숫자를 기억하라.'");
  addClue("오래된 편지");
 }
 else if(obj==="clock"){
  say("벽시계가 멈춰 있습니다. 시계 바늘은 8시 24분을 가리키고 있습니다.");
  addClue("멈춘 시계: 8시 24분");
 }
 else if(obj==="box"){
  if(boxOpen){
   say("상자 안은 비어 있습니다.");
  }else{
   say("작은 나무 상자입니다. 네 자리 숫자 암호가 필요합니다.");
  }
 }
 else if(obj==="door"){
  if(boxOpen){
   won=true;
   say("철컥! 문이 열렸습니다. 축하합니다! 방을 탈출했습니다. 🎉");
  }else{
   say("문이 잠겨 있습니다. 먼저 방 안의 비밀을 찾아야 합니다.");
  }
 }
}

function unlock(){
 if(won)return;
 const code=document.getElementById("code").value;
 if(code==="0824"){
  boxOpen=true;
  say("정답입니다! 상자가 열렸습니다. 열쇠를 발견했습니다! 이제 문을 열어보세요.");
  addClue("황동 열쇠");
 }else{
  say("암호가 틀렸습니다. 발견한 단서를 다시 살펴보세요.");
 }
}
</script>
</body>
</html>
